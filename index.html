<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト作成支援ツール(プロトタイプ)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --navy: #1b2a4a;
    --navy-light: #2f4270;
    --paper: #f7f8fa;
    --line: #d9dde3;
    --ink: #1c1f26;
    --sub: #6b7280;
    --warn: #c0392b;
    --warn-bg: #fdecea;
    --holiday: #eef1f5;
    --req-holiday: #eaf3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 13px;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: 0.02em; }
  header span { font-size: 12px; color: #b9c3da; }

  .layout { display: flex; gap: 0; align-items: flex-start; }
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid var(--line);
    min-height: calc(100vh - 56px);
    padding: 18px;
  }
  .main { flex: 1; padding: 18px; overflow-x: auto; }

  .panel { margin-bottom: 22px; }
  .panel h2 {
    font-size: 12px;
    color: var(--sub);
    margin: 0 0 10px;
    font-weight: 700;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }

  .field-row { display: flex; gap: 6px; margin-bottom: 6px; }
  input[type=text], select {
    font-size: 12.5px;
    padding: 6px 7px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  button {
    font-size: 12.5px;
    padding: 6px 10px;
    border-radius: 3px;
    border: 1px solid var(--navy);
    background: var(--navy);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: var(--navy-light); }
  button.ghost {
    background: #fff;
    color: var(--navy);
  }
  button.ghost:hover { background: #eef0f5; }
  button.small { padding: 3px 7px; font-size: 11px; }
  button.danger { background: #fff; color: var(--warn); border-color: var(--warn); }
  button.danger:hover { background: var(--warn-bg); }

  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    border-bottom: 1px solid #f0f1f4;
    font-size: 12.5px;
  }
  .list-item .meta { color: var(--sub); font-size: 11px; }

  .period-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .period-summary {
    background: #eef1f8;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--navy);
    margin-top: 6px;
    line-height: 1.6;
  }

  table.shift {
    border-collapse: collapse;
    background: #fff;
    min-width: 100%;
  }
  table.shift th, table.shift td {
    border: 1px solid var(--line);
    padding: 0;
    text-align: center;
  }
  .col-name {
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 3;
    text-align: left;
    padding: 6px 8px !important;
    min-width: 150px;
    font-weight: 600;
  }
  .col-name.name-warn {
    border-left: 4px solid var(--warn);
    color: var(--warn);
  }
  .col-course {
    position: sticky;
    left: 150px;
    background: #fff;
    z-index: 3;
    min-width: 90px;
    font-size: 11px;
    color: var(--sub);
    padding: 6px 6px !important;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--navy);
    color: #fff;
    z-index: 2;
    font-weight: 600;
    padding: 5px 2px;
    font-size: 11px;
    min-width: 46px;
  }
  thead th.corner1 { left: 0; z-index: 4; min-width: 150px; }
  thead th.corner2 { left: 150px; z-index: 4; min-width: 90px; }
  thead th.sat { background: #4a7fb5; }
  thead th.sun { background: #b56a80; }
  thead .wd { display: block; font-weight: 400; font-size: 10px; opacity: 0.85; }

  td.cell.col-sat { background: #eaf5fb; }
  td.cell.col-sun { background: #fbeaf0; }
  td.cell.col-sat.holiday, td.cell.col-sun.holiday { background: #f2f3f6; }
  td.cell.col-sat.req-holiday, td.cell.col-sun.req-holiday { background: #dfeaf9; }
  td.cell.col-sat.dup, td.cell.col-sun.dup { background: var(--warn-bg); }

  td.cell input {
    width: 100%;
    height: 30px;
    border: none;
    text-align: center;
    font-size: 12px;
    background: transparent;
    padding: 0 2px;
  }
  td.cell input:focus { outline: 2px solid var(--navy-light); outline-offset: -2px; }
  td.cell select {
    width: 100%;
    height: 28px;
    border: none;
    text-align: center;
    text-align-last: center;
    font-size: 11.5px;
    background: transparent;
    color: var(--ink);
  }
  td.cell select:focus { outline: 2px solid var(--navy-light); outline-offset: -2px; }
  td.cell .custom-input {
    height: 20px;
    font-size: 11px;
    border-top: 1px dashed var(--line);
  }
  td.cell.holiday { background: var(--holiday); }
  td.cell.req-holiday { background: var(--req-holiday); }
  td.cell.dup { background: var(--warn-bg); }
  td.cell.dup input { color: var(--warn); font-weight: 700; }

  .warning-box {
    margin-top: 14px;
    padding: 10px 14px;
    background: var(--warn-bg);
    border: 1px solid #f0c3bd;
    border-radius: 4px;
    color: var(--warn);
    font-size: 12.5px;
    display: none;
  }
  .warning-box.show { display: block; }
  .warning-box b { display: block; margin-bottom: 4px; }

  .legend-note {
    font-size: 11px;
    color: var(--sub);
    margin-top: 4px;
    line-height: 1.6;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .toolbar h3 { margin: 0; font-size: 14px; }
  .proto-tag {
    font-size: 10.5px;
    background: #fff3cd;
    color: #8a6d1a;
    border: 1px solid #f0dfa0;
    padding: 2px 8px;
    border-radius: 10px;
  }

  #printTitle { display: none; }

  #captureArea.pdf-capture #printTitle {
    display: block;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  #captureArea.pdf-capture #tableScroll {
    max-height: none !important;
    overflow: visible !important;
  }
  #captureArea.pdf-capture table.shift thead th,
  #captureArea.pdf-capture .col-name,
  #captureArea.pdf-capture .col-course {
    position: static !important;
  }

  #lineShareBtn:disabled { opacity: 0.6; cursor: default; }

  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    body { background: #fff; font-size: 9px; }
    header, .sidebar, .toolbar, .warning-box { display: none !important; }
    .layout { display: block; }
    .main { padding: 0; overflow: visible; }
    .main > div[style] { max-height: none !important; overflow: visible !important; border: none !important; }
    #printTitle {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    table.shift { width: 100%; font-size: 8.5px; }
    thead th { position: static; padding: 3px 1px; }
    thead th.corner1, thead th.corner2 { position: static; }
    .col-name, .col-course { position: static; }
    .col-name { min-width: auto; padding: 3px 5px !important; }
    .col-course { min-width: auto; font-size: 8px; padding: 3px 3px !important; }
    td.cell input, td.cell select { height: 16px; font-size: 8.5px; }
    td.cell .custom-input:placeholder-shown { display: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>シフト作成支援ツール</h1>
  <span>佐川急便八王子シフト ー プロトタイプ</span>
</header>

<div class="layout">
  <div class="sidebar">

    <div class="panel">
      <h2>① シフト期間の設定</h2>
      <div class="period-grid">
        <select id="periodPattern">
          <option value="eom">月末締め(1日〜末日)</option>
          <option value="20">20日締め(21日〜20日)</option>
          <option value="15">15日締め(16日〜15日)</option>
        </select>
        <input type="month" id="baseMonth">
      </div>
      <div class="period-summary" id="periodSummary"></div>
    </div>

    <div class="panel">
      <h2>② ドライバー登録</h2>
      <div class="field-row">
        <input type="text" id="drvName" placeholder="担当者名">
      </div>
      <div class="field-row">
        <input type="text" id="drvCourse" placeholder="コース">
        <input type="text" id="drvNo" placeholder="号車">
      </div>
      <button onclick="addDriver()" style="width:100%">追加</button>
      <div id="driverList" style="margin-top:8px;"></div>
    </div>

    <div class="panel">
      <h2>③ 凡例・略語(追加可能)</h2>
      <div class="field-row">
        <input type="text" id="legAbbr" placeholder="略語(例: 川ォ)">
        <input type="text" id="legFull" placeholder="正式名">
      </div>
      <button onclick="addLegend()" style="width:100%">追加</button>
      <div id="legendList" style="margin-top:8px;"></div>
      <div class="legend-note">〇=公休 / ◎=希望休 / DR=休み(別表記)は固定記号として最初から使用できます。</div>
    </div>

    <div class="panel">
      <h2>④ 前月最終休日(連続勤務チェック用)</h2>
      <div class="legend-note" style="margin-bottom:6px;">各ドライバーの前月最終の公休・希望休日を入力すると、今月最初の休日までの連続勤務日数が6日を超えていないか自動チェックします。</div>
      <div id="lastOffList"></div>
    </div>

  </div>

  <div class="main">
    <div class="toolbar">
      <h3 id="gridTitle">シフト表</h3>
      <div style="display:flex; gap:8px; align-items:center;">
        <span class="proto-tag">プロトタイプ:入力内容は保存されません</span>
        <button class="ghost" onclick="window.print()">印刷/PDF保存</button>
        <button id="lineShareBtn" onclick="shareToLine()">LINEで共有</button>
        <button id="driveSaveBtn" class="ghost" onclick="createGoogleSheet()">Googleスプレッドシートに保存</button>
      </div>
    </div>
    <div id="shareStatus" style="display:none; margin-bottom:8px; font-size:12px; color:var(--navy); background:#eef1f8; padding:6px 10px; border-radius:4px;"></div>
    <div id="captureArea">
      <div id="printTitle"></div>
      <div id="tableScroll" style="overflow:auto; max-height: 78vh; border:1px solid var(--line);">
        <table class="shift" id="shiftTable"></table>
      </div>
    </div>
    <div class="warning-box" id="dupWarning">
      <b>⚠ ダブルブッキングの可能性があります</b>
      <div id="dupDetail"></div>
    </div>
    <div class="warning-box" id="consecWarning">
      <b>⚠ 連続勤務日数が6日を超えています</b>
      <div id="consecDetail"></div>
    </div>
  </div>
</div>

<script>
// ---------- 状態管理 ----------
let drivers = [
  { name: "清水龍明", course: "代走", no: "719" },
  { name: "萩原健太", course: "代走", no: "9921" },
  { name: "秋山純一", course: "上川、川口 上", no: "706" },
  { name: "清水幸雄", course: "楢原", no: "721" },
  { name: "石川潤一", course: "中野上", no: "717" },
  { name: "宮川樹", course: "中野山王", no: "709" },
  { name: "安田徹", course: "諏訪、上壱分方", no: "705" },
  { name: "福井崇", course: "叶谷", no: "700" },
];

let legends = [
  { abbr: "川ォ", full: "川口ALL、上川" },
  { abbr: "谷み犬", full: "谷野、みつい、犬目1-899" },
  { abbr: "楢犬", full: "楢原All、犬目900〜" },
  { abbr: "中上", full: "中野上、清川" },
  { abbr: "山王", full: "中野山王、中野" },
  { abbr: "横叶大", full: "横川1-699、大楽寺、叶谷" },
  { abbr: "上〜泉", full: "上壱分方、諏訪、四谷、泉" },
];

const SPECIAL = ["〇", "◎", "DR"]; // 公休・希望休・休み(集計対象外)

// 2026年(令和8年)国民の祝日・休日
const JP_HOLIDAYS_2026 = [
  "2026/01/01","2026/01/12","2026/02/11","2026/02/23","2026/03/20",
  "2026/04/29","2026/05/03","2026/05/04","2026/05/05","2026/05/06",
  "2026/07/20","2026/08/11","2026/09/21","2026/09/22","2026/09/23",
  "2026/10/12","2026/11/03","2026/11/23",
];
function isHoliday(d) {
  return JP_HOLIDAYS_2026.includes(fmtFull(d));
}

let shiftData = {}; // key: `${driverIndex}_${dateStr}` -> value

// ---------- 期間計算 ----------
function computePeriod(pattern, baseMonthStr) {
  // baseMonthStr: "YYYY-MM"
  const [y, m] = baseMonthStr.split("-").map(Number); // m: 1-12
  let start, end;
  if (pattern === "eom") {
    start = new Date(y, m - 1, 1);
    end = new Date(y, m, 0);
  } else if (pattern === "20") {
    start = new Date(y, m - 2, 21);
    end = new Date(y, m - 1, 20);
  } else if (pattern === "15") {
    start = new Date(y, m - 2, 16);
    end = new Date(y, m - 1, 15);
  }
  const dates = [];
  let cur = new Date(start);
  while (cur <= end) {
    dates.push(new Date(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return { start, end, dates };
}

function fmt(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function fmtFull(d) {
  return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}
const WD = ["日","月","火","水","木","金","土"];

// ---------- 描画 ----------
function render() {
  const pattern = document.getElementById("periodPattern").value;
  const baseMonth = document.getElementById("baseMonth").value;
  if (!baseMonth) return;

  const { start, end, dates } = computePeriod(pattern, baseMonth);
  document.getElementById("periodSummary").innerText =
    `対象期間: ${fmtFull(start)} 〜 ${fmtFull(end)} (${dates.length}日間)`;
  document.getElementById("gridTitle").innerText =
    `シフト表(${fmt(start)}〜${fmt(end)})`;
  document.getElementById("printTitle").innerText =
    `佐川急便八王子シフト ${fmtFull(start)} 〜 ${fmtFull(end)}`;

  // ヘッダー
  let thead = `<thead><tr><th class="corner1">担当者</th><th class="corner2">コース/号車</th>`;
  dates.forEach(d => {
    const wd = d.getDay();
    const cls = (wd === 0 || isHoliday(d)) ? "sun" : wd === 6 ? "sat" : "";
    thead += `<th class="${cls}">${fmt(d)}<span class="wd">${WD[wd]}</span></th>`;
  });
  thead += `</tr></thead>`;

  // ボディ
  const options = buildOptionList();
  let tbody = "<tbody>";
  drivers.forEach((drv, di) => {
    tbody += `<tr><td class="col-name" id="name-${di}">${drv.name}</td><td class="col-course">${drv.course}<br>${drv.no}</td>`;
    dates.forEach(d => {
      const key = `${di}_${fmtFull(d)}`;
      const val = shiftData[key] || "";
      const wd = d.getDay();
      const colCls = (wd === 0 || isHoliday(d)) ? "col-sun" : wd === 6 ? "col-sat" : "";
      tbody += `<td class="cell ${colCls}" data-key="${key}">${cellHtml(key, val, options)}</td>`;
    });
    tbody += `</tr>`;
  });
  tbody += "</tbody>";

  document.getElementById("shiftTable").innerHTML = thead + tbody;
  refreshChecks(dates);
}

// 凡例・ドライバーのコースから選択肢を生成
function buildOptionList() {
  const set = new Set();
  legends.forEach(l => set.add(l.abbr));
  drivers.forEach(d => {
    d.course.split(/[、,]/).forEach(c => {
      const t = c.trim();
      if (t) set.add(t);
    });
  });
  return Array.from(set).sort((a, b) => a.localeCompare(b, "ja"));
}

function cellHtml(key, val, options) {
  const isCustom = val && !SPECIAL.includes(val) && !options.includes(val);
  let opts = `<option value=""></option>`;
  opts += `<optgroup label="特殊">` +
    SPECIAL.map(s => `<option value="${s}" ${s === val ? "selected" : ""}>${s}</option>`).join("") +
    `</optgroup>`;
  opts += `<optgroup label="コース">` +
    options.map(o => `<option value="${o}" ${o === val ? "selected" : ""}>${o}</option>`).join("") +
    `</optgroup>`;
  opts += `<option value="__custom__" ${isCustom ? "selected" : ""}>＋自由入力</option>`;
  return `
    <select onchange="onCellSelect('${key}', this)">${opts}</select>
    <input type="text" class="custom-input" value="${isCustom ? val : ""}"
      placeholder="入力" style="display:${isCustom ? "block" : "none"}"
      oninput="onCellInput('${key}', this.value)">
  `;
}

function onCellSelect(key, selectEl) {
  const val = selectEl.value;
  const td = selectEl.closest("td");
  const customInput = td.querySelector(".custom-input");
  if (val === "__custom__") {
    customInput.style.display = "block";
    customInput.value = "";
    customInput.focus();
    shiftData[key] = "";
  } else {
    customInput.style.display = "none";
    customInput.value = "";
    shiftData[key] = val;
  }
  refreshDuplicates();
}

function refreshDuplicates() {
  refreshChecks();
}

function refreshChecks(datesArg) {
  const pattern = document.getElementById("periodPattern").value;
  const baseMonth = document.getElementById("baseMonth").value;
  const dates = datesArg || computePeriod(pattern, baseMonth).dates;
  checkDuplicates(dates);
  checkConsecutiveWork(dates);
}

function onCellInput(key, val) {
  shiftData[key] = val;
  refreshDuplicates();
}

// ---------- ダブルブッキング検知 ----------
function checkDuplicates(dates) {
  const dupCells = [];
  const dupMessages = [];

  dates.forEach(d => {
    const dateStr = fmtFull(d);
    const courseMap = {}; // course value -> [driverIndex,...]
    drivers.forEach((drv, di) => {
      const key = `${di}_${dateStr}`;
      const val = (shiftData[key] || "").trim();
      if (!val || SPECIAL.includes(val)) return;
      if (!courseMap[val]) courseMap[val] = [];
      courseMap[val].push(di);
    });
    Object.entries(courseMap).forEach(([course, list]) => {
      if (list.length > 1) {
        list.forEach(di => dupCells.push(`${di}_${dateStr}`));
        const names = list.map(i => drivers[i].name).join("・");
        dupMessages.push(`${fmt(d)}(${WD[d.getDay()]}) 「${course}」に ${names} が重複しています`);
      }
    });
  });

  // クリア→再適用
  document.querySelectorAll("td.cell").forEach(td => td.classList.remove("dup"));
  dupCells.forEach(key => {
    const td = document.querySelector(`td[data-key="${key}"]`);
    if (td) td.classList.add("dup");
  });

  const box = document.getElementById("dupWarning");
  const detail = document.getElementById("dupDetail");
  if (dupMessages.length) {
    box.classList.add("show");
    detail.innerHTML = dupMessages.map(m => `・${m}`).join("<br>");
  } else {
    box.classList.remove("show");
  }
}

// ---------- 連続勤務日数チェック(6日超過) ----------
const OFF_MARKS = ["〇", "◎"]; // 公休・希望休のみ対象(DRは対象外)

function checkConsecutiveWork(dates) {
  if (!dates.length) return;
  const periodEnd = dates[dates.length - 1];
  const violations = [];
  const violDriverIdx = new Set();

  drivers.forEach((drv, di) => {
    document.querySelectorAll(`#name-${di}`).forEach(el => el.classList.remove("name-warn"));
    if (!drv.lastOff) return;
    const lastOffDate = new Date(drv.lastOff + "T00:00:00");

    let firstOffInPeriod = null;
    for (const d of dates) {
      const key = `${di}_${fmtFull(d)}`;
      const val = shiftData[key];
      if (OFF_MARKS.includes(val)) { firstOffInPeriod = d; break; }
    }

    let workingDays;
    if (firstOffInPeriod) {
      workingDays = Math.round((firstOffInPeriod - lastOffDate) / 86400000) - 1;
    } else {
      workingDays = Math.round((periodEnd - lastOffDate) / 86400000);
    }
    if (workingDays < 0) return; // 前月最終休日が対象期間内の日付など、想定外の入力は無視

    if (workingDays > 6) {
      violDriverIdx.add(di);
      violations.push({
        name: drv.name,
        lastOff: fmtFull(lastOffDate),
        nextOff: firstOffInPeriod ? fmtFull(firstOffInPeriod) : "期間内に休日なし",
        workingDays,
      });
    }
  });

  violDriverIdx.forEach(di => {
    const el = document.getElementById(`name-${di}`);
    if (el) el.classList.add("name-warn");
  });

  const box = document.getElementById("consecWarning");
  const detail = document.getElementById("consecDetail");
  if (violations.length) {
    box.classList.add("show");
    detail.innerHTML = violations.map(v =>
      `・${v.name}: 前月最終休日 ${v.lastOff} 〜 次の休日 ${v.nextOff}(連続勤務 ${v.workingDays}日)`
    ).join("<br>");
  } else {
    box.classList.remove("show");
  }
}

// ---------- PDF生成 & LINE共有 ----------
async function generatePdfBlob() {
  const area = document.getElementById("captureArea");
  area.classList.add("pdf-capture");
  try {
    const canvas = await html2canvas(area, { scale: 2, backgroundColor: "#ffffff" });
    const imgData = canvas.toDataURL("image/png");
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const props = pdf.getImageProperties(imgData);
    const ratio = Math.min(pageW / props.width, pageH / props.height);
    const w = props.width * ratio;
    const h = props.height * ratio;
    pdf.addImage(imgData, "PNG", (pageW - w) / 2, (pageH - h) / 2, w, h);
    return pdf.output("blob");
  } finally {
    area.classList.remove("pdf-capture");
  }
}

async function shareToLine() {
  const btn = document.getElementById("lineShareBtn");
  const status = document.getElementById("shareStatus");
  btn.disabled = true;
  status.style.display = "block";
  status.innerText = "PDFを生成しています…";

  try {
    const blob = await generatePdfBlob();
    const fileName = `シフト表_${document.getElementById("baseMonth").value}.pdf`;
    const file = new File([blob], fileName, { type: "application/pdf" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      status.innerText = "共有メニューを開いています…";
      await navigator.share({
        files: [file],
        title: "シフト表",
        text: "シフト表を共有します",
      });
      status.innerText = "共有メニューを閉じました。";
    } else {
      // 共有APIに対応していない環境(主にPC)向けフォールバック
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
      status.innerText = "この端末はLINEへの直接共有に対応していないため、PDFをダウンロードしました。LINEアプリから手動で送信してください。";
    }
  } catch (e) {
    if (e && e.name === "AbortError") {
      status.innerText = "共有をキャンセルしました。";
    } else {
      status.innerText = "PDFの生成に失敗しました。もう一度お試しください。";
      console.error(e);
    }
  } finally {
    btn.disabled = false;
    setTimeout(() => { status.style.display = "none"; }, 6000);
  }
}

function buildSheetRows(dates) {
  const header = ["担当者", "コース/号車", ...dates.map(d => `${fmt(d)}(${WD[d.getDay()]})`)];
  const rows = [header];
  drivers.forEach((drv, di) => {
    const row = [drv.name, `${drv.course} / ${drv.no}`];
    dates.forEach(d => {
      const key = `${di}_${fmtFull(d)}`;
      row.push(shiftData[key] || "");
    });
    rows.push(row);
  });
  return rows;
}

async function createSheet(title, dates, accessToken) {
  const headers = { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" };

  // 1. スプレッドシート本体を作成
  const createRes = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
    method: "POST",
    headers,
    body: JSON.stringify({ properties: { title } }),
  });
  if (!createRes.ok) throw new Error("Sheet create failed: " + await createRes.text());
  const createData = await createRes.json();
  const spreadsheetId = createData.spreadsheetId;
  const sheetId = createData.sheets[0].properties.sheetId;

  // 2. データを書き込み
  const rows = buildSheetRows(dates);
  const updateRes = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/A1?valueInputOption=RAW`,
    { method: "PUT", headers, body: JSON.stringify({ values: rows }) }
  );
  if (!updateRes.ok) throw new Error("Sheet values update failed: " + await updateRes.text());

  // 3. 書式(見出し固定・見出し色・土日祝の色付け)
  const requests = [
    {
      updateSheetProperties: {
        properties: { sheetId, gridProperties: { frozenRowCount: 1, frozenColumnCount: 2 } },
        fields: "gridProperties.frozenRowCount,gridProperties.frozenColumnCount",
      },
    },
    {
      repeatCell: {
        range: { sheetId, startRowIndex: 0, endRowIndex: 1 },
        cell: {
          userEnteredFormat: {
            backgroundColor: { red: 0.106, green: 0.165, blue: 0.290 },
            textFormat: { foregroundColor: { red: 1, green: 1, blue: 1 }, bold: true },
          },
        },
        fields: "userEnteredFormat(backgroundColor,textFormat)",
      },
    },
  ];
  dates.forEach((d, i) => {
    const colIndex = i + 2; // 担当者・コース/号車の2列分オフセット
    const wd = d.getDay();
    if (wd === 6) {
      requests.push({
        repeatCell: {
          range: { sheetId, startColumnIndex: colIndex, endColumnIndex: colIndex + 1, startRowIndex: 1 },
          cell: { userEnteredFormat: { backgroundColor: { red: 0.918, green: 0.961, blue: 0.984 } } },
          fields: "userEnteredFormat.backgroundColor",
        },
      });
    } else if (wd === 0 || isHoliday(d)) {
      requests.push({
        repeatCell: {
          range: { sheetId, startColumnIndex: colIndex, endColumnIndex: colIndex + 1, startRowIndex: 1 },
          cell: { userEnteredFormat: { backgroundColor: { red: 0.984, green: 0.918, blue: 0.941 } } },
          fields: "userEnteredFormat.backgroundColor",
        },
      });
    }
  });

  const formatRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
    method: "POST",
    headers,
    body: JSON.stringify({ requests }),
  });
  if (!formatRes.ok) throw new Error("Sheet format failed: " + await formatRes.text());

  return spreadsheetId;
}

async function moveFileToFolder(fileId, accessToken) {
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}?addParents=${DRIVE_FOLDER_ID}&removeParents=root&fields=id,parents`,
    { method: "PATCH", headers: { Authorization: `Bearer ${accessToken}` } }
  );
  if (!res.ok) {
    const errText = await res.text();
    throw new Error("Drive move failed: " + errText);
  }
  return res.json();
}
